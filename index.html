@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
:root{--ink:#17221f;--sub:#71807c;--line:#dfe8e2;--paper:#f7faf7;--white:#fff;--mint:#b9f3d4;--green:#20895c;--deep:#12372c;--coral:#e86d54;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Manrope,sans-serif}.mono{font-family:'DM Mono',monospace}.auth-screen{min-height:100vh;display:grid;grid-template-columns:42% 58%;background:var(--deep)}.auth-aside{padding:48px 8vw 48px 7vw;color:#effff6;display:flex;flex-direction:column;justify-content:space-between}.logo{font:800 22px Manrope;letter-spacing:-.04em}.logo span{color:var(--mint)}.aside-copy{max-width:440px}.aside-copy h1{font-size:clamp(38px,4.4vw,66px);line-height:1.03;letter-spacing:-.06em;margin-bottom:18px}.aside-copy p{color:#acd0bd;line-height:1.7;font-size:15px}.aside-foot{color:#74a18d;font-size:12px}.auth-card{background:#f7faf7;border-radius:28px 0 0 28px;padding:clamp(28px,7vw,100px) clamp(24px,9vw,130px);display:flex;align-items:center}.auth-inner{width:min(390px,100%)}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.auth-inner h2{font-size:32px;letter-spacing:-.04em;margin-bottom:8px}.muted{color:var(--sub);font-size:14px;line-height:1.55}.form{margin-top:26px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:700;color:#40504a}.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #20895c18}.primary{border:0;background:var(--deep);color:#fff;border-radius:8px;padding:12px 17px;font-weight:700}.primary:hover{background:#205645}.secondary{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600}.link{border:0;padding:0;background:none;color:var(--green);font-weight:700;font-size:13px}.auth-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.notice{padding:11px 13px;border-radius:8px;font-size:13px;margin-top:15px;background:#edf8f1;color:#22734f}.notice.error{background:#fff0ed;color:#a84432}.small{font-size:11px;color:var(--sub)}
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.sidebar{background:var(--deep);color:#e7f6ed;padding:28px 18px;display:flex;flex-direction:column}.sidebar .logo{padding:0 14px 44px}.side-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#729b89;padding:0 14px 10px}.nav{display:grid;gap:4px}.nav button{background:none;border:0;color:#a9c9b8;text-align:left;padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600}.nav button.active,.nav button:hover{background:#214b3e;color:#fff}.sidebar-bottom{margin-top:auto;padding:15px 14px;border-top:1px solid #2c5547;color:#8fb4a1;font-size:12px;line-height:1.6}.signout{margin-top:18px;color:#f2a291!important;padding:0!important}.main{padding:32px clamp(22px,4vw,62px);max-width:1500px;width:100%}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.topbar h1{font-size:27px;letter-spacing:-.05em}.topbar .muted{margin-top:5px}.profile{display:flex;gap:10px;align-items:center}.avatar{height:38px;width:38px;background:var(--mint);color:var(--deep);border-radius:50%;display:grid;place-items:center;font-weight:800}.profile strong{display:block;font-size:13px}.profile span{display:block;font-size:11px;color:var(--sub)}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.metric{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.metric .label{font-size:12px;color:var(--sub);margin-bottom:12px}.metric .value{font:500 25px 'DM Mono';letter-spacing:-.06em}.metric .delta{font-size:11px;color:var(--green);margin-top:8px}.content-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px}.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.panel h2{font-size:16px;letter-spacing:-.03em}.panel-head .muted{font-size:12px;margin-top:4px}.chart{height:210px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--line);padding:15px 4px 0}.bar{flex:1;background:var(--mint);border-radius:5px 5px 0 0;min-height:12px;position:relative}.bar.negative{background:#ffd0c7}.bar:hover{background:var(--green)}.bar-label{position:absolute;top:calc(100% + 8px);font:10px 'DM Mono';color:var(--sub);width:100%;text-align:center}.legend{display:flex;gap:16px;margin-top:25px;font-size:11px;color:var(--sub)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--mint);margin-right:5px}.legend i.red{background:#ffd0c7}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:13px 10px;border-bottom:1px solid #edf2ee;white-space:nowrap}tr:last-child td{border-bottom:0}.right{text-align:right}.pill{display:inline-flex;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700}.pill.active{background:#e6f7ec;color:var(--green)}.pill.disabled{background:#f2f3f3;color:var(--sub)}.user-cell{display:flex;align-items:center;gap:9px}.mini-avatar{height:27px;width:27px;border-radius:50%;display:grid;place-items:center;background:#e1f1e8;color:var(--green);font-size:10px;font-weight:800}.action{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;margin-left:11px}.action.danger{color:var(--coral)}.activity{display:grid;gap:15px}.activity-row{display:flex;gap:10px}.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);margin-top:5px;flex:none}.activity-row p{font-size:12px;line-height:1.4}.activity-row time{display:block;font-size:10px;color:var(--sub);margin-top:3px}.select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.toolbar .filters{display:flex;gap:8px}.user-list{display:grid;gap:10px}.user-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:9px}.user-row:hover{border-color:#a7d8bc}.user-meta strong{display:block;font-size:13px}.user-meta span{display:block;color:var(--sub);font-size:11px;margin-top:2px}.user-row .value{font:12px 'DM Mono'}.user-actions{white-space:nowrap}.empty{padding:28px;text-align:center;color:var(--sub);font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#0b221c66;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:var(--white);border-radius:14px;padding:24px;width:min(460px,100%);box-shadow:0 22px 70px #09261d33}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.close{border:0;background:none;font-size:24px;color:var(--sub)}.modal h2{font-size:20px}.modal .form{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:var(--deep);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;z-index:10;box-shadow:0 10px 30px #09261d33}@media(max-width:900px){.auth-screen{grid-template-columns:1fr}.auth-aside{display:none}.auth-card{border-radius:0}.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2;padding:12px 16px;display:block}.sidebar .logo{padding:0 0 12px}.side-label,.sidebar-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:24px 16px}.metric-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.user-row{grid-template-columns:1fr 1fr}.user-actions{grid-column:1/-1}.topbar{align-items:flex-start}}@media(max-width:540px){.topbar .profile{display:none}.metric .value{font-size:19px}.chart{gap:5px}.toolbar{align-items:stretch;flex-direction:column}.toolbar .filters{flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modalRoot"></div><script>
const seedUsers=[];const seedTrades=[];const defaultMonths=[];let page='overview';const $=s=>document.querySelector(s),initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2),money=n=>`${n<0?'-':''}$${Math.abs(n).toLocaleString()}`;function save(){}function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2800)}
function auth(){document.body.innerHTML='<div class="auth-screen"><aside class="auth-aside"><div class="logo">trade<span>signal</span></div><div class="aside-copy"><h1>Know your edge.<br>Own your numbers.</h1><p>A calm command center for teams who take every trade seriously. Track performance, keep accounts secure, and make better decisions together.</p></div><div class="aside-foot">PRIVATE TRADING OPERATIONS · 2026</div></aside><main class="auth-card"><div class="auth-inner"><div class="eyebrow">Secure workspace</div><h2>Welcome back</h2><p class="muted">Sign in to your TradeSignal workspace.</p><form class="form" id="loginForm"><div class="field"><label>Email address</label><input id="email" type="email" value="" required></div><div class="field"><label>Password</label><input id="password" type="password" value="" required></div><button class="primary" style="width:100%">Sign in to workspace</button></form><div class="auth-actions"><button class="link" id="forgotBtn">Forgot password?</button><span class="small">Email verification is handled by Supabase</span></div><div id="authNotice"></div></div></main></div>';$('#loginForm').onsubmit=e=>{e.preventDefault();if(false)renderApp();else $('#authNotice').innerHTML='<div class="notice error">Sign in through Supabase Auth.</div>'};$('#forgotBtn').onclick=forgot}
function forgot(){document.querySelector('.auth-inner').innerHTML='<div class="eyebrow">Account recovery</div><h2>Reset your password</h2><p class="muted">We will send a verification link to your registered email address.</p><form class="form" id="resetForm"><div class="field"><label>Work email</label><input id="resetEmail" type="email" placeholder="admin@tradesignal.io" required></div><button class="primary" style="width:100%">Send verification email</button></form><div class="auth-actions"><button class="link" id="backLogin">Back to sign in</button></div><div id="authNotice"></div>';$('#resetForm').onsubmit=e=>{e.preventDefault();$('#authNotice').innerHTML='<div class="notice">Verification link sent. Check your inbox to create a new password.</div>';setTimeout(reset,700)};$('#backLogin').onclick=auth}function reset(){document.querySelector('.auth-inner').innerHTML='<div class="eyebrow">Verified email</div><h2>Create a new password</h2><p class="muted">Your verification code is accepted for this demo.</p><form class="form" id="newPass"><div class="field"><label>New password</label><input type="password" required minlength="8"></div><div class="field"><label>Confirm new password</label><input type="password" required minlength="8"></div><button class="primary" style="width:100%">Update password</button></form>';$('#newPass').onsubmit=e=>{e.preventDefault();setTimeout(()=>{$('#authNotice').innerHTML='<div class="notice">Password updated. Sign in with your new password.</div>'},30)}}
function shell(){return `<aside class="sidebar"><div class="logo">trade<span>signal</span></div><div class="side-label">Workspace</div><nav class="nav"><button data-page="overview">▦ &nbsp; Overview</button><button data-page="users">◌ &nbsp; User accounts</button><button data-page="trades">↗ &nbsp; Trade history</button><button data-page="analytics">⌁ &nbsp; Monthly analytics</button><a href="analyzer.html" style="display:block;color:#a9c9b8;text-decoration:none;padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600">⌁ &nbsp; Trading tools</a></nav><div class="sidebar-bottom">All data is private to your workspace.<button class="link signout" id="signout">Sign out ↗</button></div></aside><main class="main" id="main"></main>`}function pageHeader(title,sub){return `<div class="topbar"><div><h1>${title}</h1><p class="muted">${sub}</p></div><div class="profile"><div class="avatar">AM</div><div><strong>Avery Morgan</strong><span>Administrator</span></div></div></div>`}function renderApp(){document.body.innerHTML='<div class="app">'+shell()+'</div><div id="modalRoot"></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderPage()});$('#signout').onclick=auth;renderPage()}function renderPage(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const main=$('#main');if(page==='overview')main.innerHTML=overview();if(page==='users')main.innerHTML=users();if(page==='trades')main.innerHTML=trades();if(page==='analytics')main.innerHTML=analytics();window.bindPage()}
function chart(data){const max=Math.max(...data.map(x=>Math.abs(x.value)));return `<div class="chart">${data.map(x=>`<div class="bar ${x.value<0?'negative':''}" style="height:${Math.max(12,Math.abs(x.value)/max*78)}%"><span class="bar-label">${x.month.split(' ')[0]}</span></div>`).join('')}</div>`}function userTable(users){return `<div class="table-wrap"><table><thead><tr><th>Trader</th><th>Status</th><th>Trades</th><th class="right">Net P&L</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><div class="user-cell"><div class="mini-avatar">${initials(u.name)}</div><div><b>${u.name}</b><div class="small">${u.email}</div></div></div></td><td><span class="pill ${u.status}">${u.status}</span></td><td class="mono">${u.trades}</td><td class="right mono" style="color:${u.pnl<0?'var(--coral)':'var(--green)'}">${money(u.pnl)}</td><td class="right"><button class="action" data-view-user="${u.id}">View</button></td></tr>`).join('')}</tbody></table></div>`}
function overview(){const total=store.users.reduce((a,u)=>a+u.pnl,0);const closed=store.trades.filter(t=>t.pnl!==undefined);const wins=closed.filter(t=>t.pnl>0).length;const winRate=closed.length?((wins/closed.length)*100).toFixed(1):'0.0';const activity=closed.slice(0,3);return pageHeader('Good morning, Avery','Here is what is happening across your trading team.')+`<section class="metric-grid"><div class="metric"><div class="label">Team P&L · current month</div><div class="value">${money(total)}</div><div class="delta">Live from Supabase</div></div><div class="metric"><div class="label">Active traders</div><div class="value">${store.users.filter(u=>u.status==='active').length}<span style="font-size:14px;color:var(--sub)"> / ${store.users.length}</span></div><div class="delta">All accounts monitored</div></div><div class="metric"><div class="label">Trades loaded</div><div class="value">${closed.length}</div><div class="delta">From authenticated records</div></div><div class="metric"><div class="label">Win rate</div><div class="value">${winRate}%</div><div class="delta">Calculated from closed trades</div></div></section><div class="content-grid"><section class="panel"><div class="panel-head"><div><h2>Team P&L</h2><p class="muted">Net realized performance from monthly Supabase aggregates</p></div><select class="select"><option>Available months</option></select></div>${defaultMonths.length?chart(defaultMonths):'<div class="empty">No monthly P&L records yet.</div>'}<div class="legend"><span><i></i>Profit</span><span><i class="red"></i>Loss</span></div></section><section class="panel"><div class="panel-head"><div><h2>Latest activity</h2><p class="muted">Recent closed trades</p></div></div><div class="activity">${activity.length?activity.map(t=>`<div class="activity-row"><i class="activity-dot"></i><p><b>${t.user}</b> closed ${t.asset} for <b class="mono" style="color:${t.pnl<0?'var(--coral)':'var(--green)'}">${money(t.pnl)}</b><time>${t.date}</time></p></div>`).join(''):'<div class="empty">No trade activity yet.</div>'}</div></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Trader leaderboard</h2><p class="muted">Performance across loaded records</p></div><button class="secondary" id="manageBtn">Manage users</button></div>${store.users.length?userTable(store.users):'<div class="empty">No trader accounts yet.</div>'}</section>`}function users(){return pageHeader('User accounts','Create, edit, disable, or remove access for your trading team.')+`<div class="toolbar"><div class="filters"><input class="select" id="userSearch" placeholder="Search users..." type="search"><select class="select" id="statusFilter"><option>All statuses</option><option>Active</option><option>Disabled</option></select></div><button class="primary" id="addUser">+ Create user</button></div><section class="panel"><div id="userList" class="user-list">${store.users.map(userRow).join('')}</div></section>`}function userRow(u){return `<div class="user-row"><div class="user-cell"><div class="mini-avatar">${initials(u.name)}</div><div class="user-meta"><strong>${u.name}</strong><span>${u.email}</span></div></div><div><span class="small">Role</span><div class="user-meta"><strong>${u.role}</strong></div></div><div><span class="small">Joined</span><div class="value">${u.joined}</div></div><div><span class="small">Monthly P&L</span><div class="value" style="color:${u.pnl<0?'var(--coral)':'var(--green)'}">${money(u.pnl)}</div></div><div class="user-actions"><span class="pill ${u.status}">${u.status}</span><button class="action" data-edit="${u.id}">Edit</button><button class="action danger" data-delete="${u.id}">Delete</button></div></div>`}function trades(){return pageHeader('Trade history','Every executed position, organized by trader and outcome.')+`<section class="panel"><div class="toolbar"><div><h2>All trades</h2><p class="muted">${store.trades.length} records in the current workspace</p></div><div class="filters"><select class="select" id="tradeUser"><option>All traders</option>${store.users.map(u=>`<option>${u.name}</option>`).join('')}</select><select class="select"><option>September 2026</option><option>August 2026</option></select></div></div><div class="table-wrap"><table id="tradesTable"><thead><tr><th>Trader</th><th>Instrument</th><th>Side</th><th>Date</th><th class="right">Realized P&L</th></tr></thead><tbody>${store.trades.map(t=>`<tr data-trader="${t.user}"><td><b>${t.user}</b></td><td class="mono">${t.asset}</td><td><span class="pill ${t.side==='Long'?'active':'disabled'}">${t.side}</span></td><td class="small">${t.date}</td><td class="right mono" style="color:${t.pnl<0?'var(--coral)':'var(--green)'}">${money(t.pnl)}</td></tr>`).join('')}</tbody></table></div></section>`}function analytics(){return pageHeader('Monthly analytics','A clear view of who is growing, and where the month moved.')+`<section class="panel"><div class="panel-head"><div><h2>Performance by trader</h2><p class="muted">Select a month to review individual realized P&L.</p></div><select class="select"><option>September 2026</option><option>August 2026</option><option>July 2026</option></select></div>${userTable(store.users)}<div style="margin-top:22px">${chart(defaultMonths)}</div><div class="legend"><span><i></i>Net profit</span><span><i class="red"></i>Net loss</span></div></section>`}
function modal(user){const editing=!!user;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">${editing?'Edit account':'New account'}</div><h2>${editing?'Update trader':'Invite a trader'}</h2><p class="muted">${editing?'Change account access and profile details.':'A temporary password will be sent to their email.'}</p></div><button class="close" id="closeModal">×</button></div><form class="form" id="userForm"><div class="field"><label>Full name</label><input id="userName" required value="${editing?user.name:''}"></div><div class="field"><label>Registered email</label><input id="userEmail" type="email" required value="${editing?user.email:''}"></div><div class="field"><label>Account status</label><select id="userStatus"><option ${!editing||user.status==='active'?'selected':''}>active</option><option ${editing&&user.status==='disabled'?'selected':''}>disabled</option></select></div><div class="notice">${editing?'Changes are saved instantly.':'A secure temporary password will be generated and emailed.'}</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">${editing?'Save changes':'Create & send invite'}</button></div></form></div></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modalRoot').innerHTML='';$('#userForm').onsubmit=e=>{e.preventDefault();const name=$('#userName').value,email=$('#userEmail').value,status=$('#userStatus').value;if(editing)Object.assign(user,{name,email,status});else store.users.unshift({id:'u'+Date.now(),name,email,role:'Trader',status,joined:'2026-09-24',pnl:0,trades:0});save();$('#modalRoot').innerHTML='';renderPage();toast(editing?'User updated.':'User invitation sent through Supabase.')}}function bindPage(){document.querySelectorAll('[data-view-user]').forEach(b=>b.onclick=()=>{page='analytics';renderPage()});$('#manageBtn')?.addEventListener('click',()=>{page='users';renderPage()});$('#addUser')?.addEventListener('click',()=>window.modal());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>window.modal(store.users.find(u=>u.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const u=store.users.find(x=>x.id===b.dataset.delete);if(confirm(`Delete ${u.name}'s account?`)){store.users=store.users.filter(x=>x.id!==u.id);save();renderPage();toast('Account deleted')}});$('#tradeUser')?.addEventListener('change',e=>document.querySelectorAll('#tradesTable tbody tr').forEach(r=>r.style.display=e.target.value==='All traders'||r.dataset.trader===e.target.value?'':'none'));$('#statusFilter')?.addEventListener('change',filterUsers);$('#userSearch')?.addEventListener('input',filterUsers)}function filterUsers(){const q=($('#userSearch')?.value||'').toLowerCase(),status=$('#statusFilter')?.value||'All statuses';document.querySelectorAll('.user-row').forEach(r=>{const text=r.textContent.toLowerCase();r.style.display=(!q||text.includes(q))&&(status==='All statuses'||text.includes(status.toLowerCase()))?'':'none'})}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-app.js"></script><script>window.supabaseBoot();</script></body></html>
